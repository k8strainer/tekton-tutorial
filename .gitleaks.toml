title = "custom gitleaks config"

[[rules]]
id          = "generic-password"
description = "password=<value>"
regex       = '''(?i)\bpassword\s*=\s*".{8,}"'''
tags        = ["password","generic"]

[[rules]]
id          = "db-password"
description = "db_password=<value>"
regex       = '''(?i)\bdb_password\s*=\s*".{8,}"'''
tags        = ["password","database"]

[[rules]]
id          = "aws-access-key-id"
description = "AWS Access Key ID"
regex       = '''(?i)\baws_access_key_id\s*=\s*"(A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z0-9]{16}"'''
tags        = ["key","AWS"]

[[rules]]
id          = "aws-secret-access-key"
description = "AWS Secret Access Key"
regex       = '''(?i)\baws_secret_access_key\s*=\s*"[A-Za-z0-9/+=]{40}"'''
tags        = ["key","AWS"]

[[rules]]
id          = "github-token"
description = "GitHub Personal Access Token"
regex       = '''(?i)\bgithub_token\s*=\s*"gh[pousr]_[A-Za-z0-9]{36,}"'''
tags        = ["token","github"]

