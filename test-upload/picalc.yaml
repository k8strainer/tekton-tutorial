apiVersion: apps/v1
kind: Deployment
metadata:
  name: picalc
  labels:
    app: picalc
    test-upload: "true"
spec:
  replicas: 6
  selector:
    matchLabels:
      app: picalc
  template:
    metadata:
      labels:
        app: picalc
        foo: "Test"
        bla: "test99"
        test: "s3679"
        test-upload: "true"
    spec:
      containers:
        - name: picalc
          image: gcr.io/cluster-01-271319/picalc@sha256:bb1cb83b4a2cd0913465fbfd0d3d402bb683686f199e1642be76902091b05df8
          ports:
            - name: http-server
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 50M
            limits:
              cpu: 200m
              memory: 80M
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "cat /proc/1/status"]
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: picalc
  labels:
    app: picalc
    foo: bar
    test-upload: "true"
spec:
  #  externalIPs:
  #  - 192.168.99.77
  ports:
    - port: 8080
      targetPort: http-server
  selector:
    app: picalc
  type: LoadBalancer
  template:
    metadata:
      labels:
        test-upload: "true"
