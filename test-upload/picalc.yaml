apiVersion: apps/v1
kind: Deployment
metadata:
  name: picalc
  labels:
    app: picalc
spec:
  replicas: 6
  selector:
    matchLabels:
      app: picalc
  template:
    metadata:
      labels:
        app: picalc
        foo: "Test"
        bla: "test99"
        test: "s3679"
    spec:
      containers:
        - name: picalc
          image: gcr.io/cluster-01-271319/picalc@sha256:6cdf02468e2c08ff3a7cb1619a795582d6e2bd1a0db1137abe4443c058cfce87
          ports:
            - name: http-server
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 50M
            limits:
              cpu: 200m
              memory: 80M
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "cat /proc/1/status"]
            initialDelaySeconds: 10
0:
  metadata:
    labels:
      test-upload: "true"
  spec:
    template:
      metadata:
        labels:
          test-upload: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: picalc
  labels:
    app: picalc
    foo: bar
spec:
  #  externalIPs:
  #  - 192.168.99.77
  ports:
    - port: 8080
      targetPort: http-server
  selector:
    app: picalc
  type: LoadBalancer
0:
  metadata:
    labels:
      test-upload: "true"
  spec:
    template:
      metadata:
        labels:
          test-upload: "true"
