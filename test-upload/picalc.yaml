apiVersion: apps/v1
kind: Deployment
metadata:
  name: picalc
  labels:
    app: picalc
    test-upload: "true"
spec:
  replicas: 6
  selector:
    matchLabels:
      app: picalc
  template:
    metadata:
      labels:
        app: picalc
        foo: "Test"
        bla: "test99"
        test: "s3679"
        test-upload: "true"
    spec:
      containers:
        - name: picalc
          image: gcr.io/cluster-01-271319/picalc@sha256:4a4725ed90ce250b49d99f5e374c9fea942ccbb5dc1c35daf42b2cfb055629b5
          ports:
            - name: http-server
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 50M
            limits:
              cpu: 200m
              memory: 80M
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "cat /proc/1/status"]
            initialDelaySeconds: 10
