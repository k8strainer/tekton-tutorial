apiVersion: apps/v1
kind: Deployment
metadata:
  name: picalc
  labels:
    app: picalc
spec:
  replicas: 3
  selector:
    matchLabels:
      app: picalc
  template:
    metadata:
      labels:
        app: picalc
        test-upload: "true"
        date: 2025-03-11_19-50-31
    spec:
      containers:
        - name: picalc
          image: gcr.io/cluster-01-271319/picalc@sha256:200dcc52a5b702c9e29d6c2db91321d7dae6b61cca8853a8bf81365cd94132c2
          resources:
            requests:
              cpu: 100m
              memory: 50M
            limits:
              cpu: 200m
              memory: 80M
          ports:
            - name: http-server
              containerPort: 8080
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "cat /proc/1/status"]
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: picalc
  labels:
    app: picalc
spec:
  ports:
    - port: 8080
      targetPort: http-server
  selector:
    app: picalc
  type: LoadBalancer
---

